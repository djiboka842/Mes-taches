<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Mes tâches</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="app">
    <p class="eyebrow">Votre espace personnel</p>
    <h1>Mes tâches</h1>
    <p class="intro">Une chose à la fois. Vous avancez déjà.</p>

    <section class="panel" aria-label="Liste de tâches">
      <form id="task-form">
        <input id="task-input" type="text" maxlength="200" placeholder="Que souhaitez-vous faire ?" aria-label="Nouvelle tâche" autocomplete="off" required>
        <button class="add-button" type="submit">Ajouter</button>
      </form>
      <div class="list-header">
        <h2>À faire</h2>
        <span id="task-count" class="count" aria-live="polite"></span>
      </div>
      <ul id="task-list" aria-label="Vos tâches"></ul>
      <div id="empty-state" class="empty" hidden>
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        </span>
        <p id="empty-title">Tout est prêt pour commencer.</p>
        <small id="empty-subtitle">Ajoutez une tâche juste au-dessus.</small>
      </div>
      <div class="footer">
        <span class="save-note"><span class="save-dot" aria-hidden="true"></span>Enregistré sur cet appareil</span>
        <span>Vos tâches restent privées</span>
      </div>
    </section>
  </main>
</body>
</html>
